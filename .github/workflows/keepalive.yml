name: Keepalive

on:
  schedule:
    # Weekly check on Sunday 00:00 UTC; pushes an empty commit only if >45 days since last commit.
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Push empty keepalive commit if inactive > 45 days
        run: |
          last_commit_ts=$(git log -1 --format=%ct)
          now_ts=$(date +%s)
          age_days=$(( (now_ts - last_commit_ts) / 86400 ))
          echo "Last commit age: ${age_days} days"

          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git push
            echo "Pushed keepalive commit to reset 60-day schedule timer."
          else
            echo "Repository active within 45 days; no commit needed."
          fi
