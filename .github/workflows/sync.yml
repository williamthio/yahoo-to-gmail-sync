name: Sync Yahoo to Gmail

on:
  # Temporarily paused until Yahoo App Password and repository secrets are configured.
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yahoo-to-gmail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked runtime dependencies
        run: uv sync --locked --no-dev

      - name: Run Yahoo-to-Gmail sync
        env:
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          YAHOO_IMAP_HOST: ${{ vars.YAHOO_IMAP_HOST }}
          YAHOO_IMAP_PORT: ${{ vars.YAHOO_IMAP_PORT }}
          YAHOO_SOURCE_FOLDER: ${{ vars.YAHOO_SOURCE_FOLDER }}
          YAHOO_ARCHIVE_FOLDER: ${{ vars.YAHOO_ARCHIVE_FOLDER }}
          SYNC_MAX_AGE_HOURS: ${{ vars.SYNC_MAX_AGE_HOURS }}
          SYNC_MAX_RUNTIME_SECONDS: ${{ vars.SYNC_MAX_RUNTIME_SECONDS }}
          GMAIL_LABEL_NAME: ${{ vars.GMAIL_LABEL_NAME }}
        run: uv run --no-sync yahoo-to-gmail-sync
